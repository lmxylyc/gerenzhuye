name: gl-publish
on:
  workflow_dispatch:
    inputs:
      payload:
        description: base64(JSON {files:[{path,b64}],dels:[path],message})
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply changes
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          set -e
          echo "$PAYLOAD" | base64 -d > /tmp/gl-payload.json
          node -e '
            const fs = require("fs");
            const path = require("path");
            const p = JSON.parse(fs.readFileSync("/tmp/gl-payload.json", "utf8"));
            for (const f of (p.files || [])) {
              fs.mkdirSync(path.dirname(f.path), { recursive: true });
              fs.writeFileSync(f.path, Buffer.from(f.b64, "base64"));
            }
            for (const d of (p.dels || [])) {
              try { fs.rmSync(d, { force: true }); } catch (e) {}
            }
          '

      - name: Commit and push
        env:
          DEPLOY_TOKEN: ${{ secrets.GL_DEPLOY_TOKEN }}
        run: |
          set -e
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::仓库未配置 GL_DEPLOY_TOKEN secret，请先在 Settings → Secrets → Actions 添加。"
            exit 1
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            exit 0
          fi
          MSG=$(node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/gl-payload.json","utf8"));process.stdout.write(p.message||"chore(gl-universe): publish")')
          git -c user.name="GL Publish" -c user.email="gl-publish@users.noreply.github.com" commit -m "$MSG"
          # 并发/远端竞争容错: push 被拒时以最新 main 为基底重新应用本次修改(避免 rebase 合并冲突)
          i=0
          while [ $i -lt 3 ]; do
            i=$((i+1))
            if git push "https://x-access-token:${DEPLOY_TOKEN}@github.com/lmxylyc/gerenzhuye.git" HEAD:main 2>/dev/null; then
              echo "PUSH_OK"
              exit 0
            fi
            echo "push rejected (attempt $i); resync to latest main and re-apply..."
            sleep 2
            git fetch origin
            git reset --hard origin/main
            node -e '
              const fs = require("fs");
              const path = require("path");
              const p = JSON.parse(fs.readFileSync("/tmp/gl-payload.json", "utf8"));
              for (const f of (p.files || [])) {
                fs.mkdirSync(path.dirname(f.path), { recursive: true });
                fs.writeFileSync(f.path, Buffer.from(f.b64, "base64"));
              }
              for (const d of (p.dels || [])) {
                try { fs.rmSync(d, { force: true }); } catch (e) {}
              }
            '
            git add -A
            if git diff --cached --quiet; then
              echo "NO_CHANGES_AFTER_REAPPLY"
              exit 0
            fi
            git -c user.name="GL Publish" -c user.email="gl-publish@users.noreply.github.com" commit -m "$MSG"
          done
          echo "::error::push failed after 3 attempts"
          exit 1