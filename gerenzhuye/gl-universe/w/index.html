<style>
.ix { max-width: 760px; margin: 0 auto; padding: 30px 14px; }
.ix h1 { font-size: 18px; color: var(--fg-bright); margin-bottom: 6px; }
.ix-sub { font-size: 12px; color: var(--fg-dim); margin-bottom: 14px; }
.ix ul { list-style: none; }
.ix li { border-bottom: 1px dotted var(--line-dim); padding: 11px 2px; }
.ix a { color: var(--fg-bright); font-size: 15px; text-decoration: none; word-break: break-all; }
.ix-meta { color: var(--fg-dim); font-size: 12px; margin-left: 8px; }
.ix-foot { text-align: center; color: var(--fg-dim); font-size: 12px; margin-top: 22px; line-height: 2; }
.ix-foot a { color: var(--fg-bright); }
.ix-loading { color: var(--fg-dim); font-size: 13px; }

/* ===== 风格优化 v3.0: 移动端 / 焦点环 / 悬停 ===== */
.ix {
  padding: calc(30px + env(safe-area-inset-top, 0px)) 14px
           calc(20px + env(safe-area-inset-bottom, 0px));
}
a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.ix a { transition: background 0.2s ease, color 0.2s ease; }
.ix li a:hover { color: var(--fg); background: rgba(53, 224, 122, 0.08); }

@media (max-width: 640px) {
  .ix { padding-left: 12px; padding-right: 12px; }
  .ix h1 { font-size: 16px; }
  .ix a { font-size: 14px; }
  .ix-meta { display: block; margin: 4px 0 0; }
  .ix li { padding: 10px 2px; }
}
@media (prefers-reduced-motion: reduce) {
  .ix a { transition: none !important; }
}
</style>
</head>
